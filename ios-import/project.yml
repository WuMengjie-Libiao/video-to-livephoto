name: LivePhotoImporter
options:
  bundleIdPrefix: com.suikii.livephoto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  LivePhotoImporter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 实况照片
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 将你确认的实况照片保存到相册
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suikii.livephoto.importer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
  LivePhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [SimulatorChecks.swift, SelectionCheck.swift]
    dependencies:
      - target: LivePhotoImporter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  LivePhotoImporter:
    build:
      targets:
        LivePhotoImporter: all
    test:
      targets:
        - LivePhotoTests
